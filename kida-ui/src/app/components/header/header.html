<div class="h-full flex items-center justify-between px-6">

    <!-- Linkerkant: Icoon + Titel + Toelichting + Tokens -->
    <div class="flex items-center gap-3 text-xs text-slate-500">
        <svg class="h-4 w-4 shrink-0 text-slate-500" viewBox="0 -960 960 960" fill="currentColor">
            <path d="M240-160v-80l160-160v-160L240-640v-80h480v80L560-480v160l160 160v80H240Zm240-280 120-120v-200H360v200l120 120Zm0 80-120 120h240L480-360Z" />
        </svg>
        <span class="font-medium text-slate-700 text-sm">Temporary chat</span>
    </div>

    <!-- Rechterkant: Alleen Nieuw (+) en Drie puntjes (⋮) -->
    <div class="flex items-center gap-1 text-slate-600">

        <!-- Plus knop -->
        <button type="button" title="Nieuwe chat" class="flex h-8 w-8 items-center justify-center rounded-full hover:bg-slate-100 transition-colors">
            <svg class="h-4 w-4" viewBox="0 -960 960 960" fill="currentColor">
                <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
            </svg>
        </button>

        <!-- Drie verticale puntjes met dropdown -->
        <div class="relative">
            <button type="button" (click)="isMenuOpen = !isMenuOpen" title="Meer opties" class="flex h-8 w-8 items-center justify-center rounded-full hover:bg-slate-100 transition-colors">
                <svg class="h-4 w-4" viewBox="0 -960 960 960" fill="currentColor">
                    <path d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z" />
                </svg>
            </button>

            <!-- Dropdown menu -->
            @if (isMenuOpen) {
            <div
                class="absolute right-0 top-full mt-1.5 w-48 rounded-xl border border-slate-200 bg-white py-1.5 shadow-lg text-xs z-30">
                <button type="button" (click)="isMenuOpen = false"
                    class="w-full text-left px-3 py-2 text-slate-700 hover:bg-slate-50 transition-colors">
                    Gesprek exporteren (.json)
                </button>
                <button type="button" (click)="isMenuOpen = false"
                    class="w-full text-left px-3 py-2 text-slate-700 hover:bg-slate-50 transition-colors">
                    Geschiedenis wissen
                </button>
                <div class="my-1 border-t border-slate-100"></div>
                <button type="button" (click)="isMenuOpen = false"
                    class="w-full text-left px-3 py-2 text-rose-600 hover:bg-rose-50 transition-colors">
                    Sessie beëindigen
                </button>
            </div>
            }
        </div>

    </div>

</div>
