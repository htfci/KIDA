<div class="flex flex-col h-full p-3 gap-2">

    <!-- Flex item 1 -->
    <div class="shrink-0 border-b border-slate-300">
        <div>
            <p class="text-lg font-bold tracking-wide">KIDA AI Studio</p>
        </div>
    </div>

    <!-- Flex item 2 -->
    <div class="flex flex-col flex-1 min-h-0 overflow-hidden gap-2">
        <!-- section 1: Build -->
        <section class="flex flex-col gap-o.5">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">build</h2>
            <div>
                Container
            </div>
        </section>

        <!-- section 2: Chats -->
        <section class="flex flex-col gap-0.5">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">chats</h2>
            <div class="">
                <a href="#" class="flex flex-row justify-start items-center gap-1.5 p-2 rounded-lg bg-slate-200 text-slate-900 hover:bg-slate-500 hover:text-white text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
                    </svg>
                    <span class="truncate">{{fileName}}</span>
                </a>
            </div>
        </section>
    </div>

    <!-- Flex item 3 -->
    <div class="shrink-0 border-t pt-1 border-slate-300">
        <div class="flex flex-row items-center gap-2.5 px-2 py-1.5 rounded-md">
            <div class="p-2 rounded-full bg-slate-300 text-[10px] font-bold text-slate-700">User</div>
            <div class="flex flex-col">
                <span class="text-xs font-medium text-slate-800 truncate">Name</span>
                <span class="text-[10px] text-slate-400 truncate">Online</span>
            </div>
        </div>
    </div>
</div>
