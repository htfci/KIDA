<div class="flex flex-row justify-between items-center pt-1">

    <!-- Leftside -->
    <div class="flex flow-row items-center gap-0.5 p-0.5 text-sm text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
        </svg>
        <span>{{chatStatus}}</span>
    </div>

    <!-- Rightside -->
    <div class="flex flex-row items-center gap-0.5">

        <!-- Plus button -->
        <button type="button" title="New chat" (click)="newChat()" class="p-0.5 hover:bg-slate-300 rounded-full cursor-pointer text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
        </button>

        <!-- Dropdown menu -->
        <div class="relative flex flex-row items-center">
            <button type="button" (click)="isMenuOpen = !isMenuOpen" title="More options" class="p-0.5 hover:bg-slate-300 rounded-full cursor-pointer text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
                </svg>
            </button>

            <!-- Dropdown menu logic -->
            @if (isMenuOpen) {
            <div class="fixed inset-0 z-10" (click)="isMenuOpen = false"></div>
            
            <div class="absolute right-0 top-full mt-1.5 w-48 rounded-xl border border-slate-200 bg-white py-1.5 shadow-lg text-xs z-30">
                <button type="button" (click)="isMenuOpen = false"
                    class="w-full text-left px-3 py-2 text-slate-700 hover:bg-slate-200 transition-colors">
                    Export chat (.json)
                </button>
                <button type="button" (click)="isMenuOpen = false"
                    class="w-full text-left px-3 py-2 text-slate-700 hover:bg-slate-200 transition-colors">
                    Remove history
                </button>
                <div class="my-1 border-t border-slate-100"></div>
                <button type="button" (click)="isMenuOpen = false"
                    class="w-full text-left px-3 py-2 text-rose-600 hover:bg-rose-200 transition-colors">
                    Terminate session
                </button>
            </div>
            }
        </div>
    </div>
</div>
