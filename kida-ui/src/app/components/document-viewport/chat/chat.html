<div class="flex flex-col h-full gap-1.5">

    <!-- Metadata header container -->
    <div class="shrink-0 mt-3 mb-3">
        <div class="rounded-lg border-2 border-slate-200 bg-white p-3 shadow-sm">
            <div class="flex flex-row justify-between items-center pb-2 border-b-2 border-slate-200">
                <div class="flex flex-row items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                    </svg>
                    <span class="text-sm font-semibold text-slate-800">{{fileName}}</span>
                </div>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 text-emerald-800">{{fileStatus}}</span>
            </div>

            <!-- Metadata main grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 pt-2 text-md">
                <div>
                    <span class="block text-slate-400 font-medium">Classificatie</span>
                    <span class="font-medium text-slate-700">{{classification}}</span>
                </div>
                <div>
                    <span class="block text-slate-400 font-medium">Dossier ID</span>
                    <span class="font-mono text-slate-700">{{docId}}</span>
                </div>
                <div>
                    <span class="block text-slate-400 font-medium">Bestandsgrootte</span>
                    <span class="text-slate-700">{{docSize}}</span>
                </div>
                <div>
                    <span class="block text-slate-400 font-medium">Status</span>
                    <span class="text-slate-700">{{status}}</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat container -->
    <div class="flex flex-col flex-1 min-h-0 overflow-y-auto p-3 gap-3">
        <!-- User msg -->
        <div class="w-fit max-w-[50%] max-h-64 rounded-xl p-1.5 bg-gray-200 overflow-y-auto">
            <p class="text-base">{{userMsg}}</p>
        </div>

        <!-- AI msg -->
        <div class="w-fit max-w-[80%] p-1.5">
            <p class="font-sans text-base">{{aiMsg}}</p>
        </div>
    </div>
</div>
